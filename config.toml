[runtime]
# How many seconds before lock_at to sample kline data. The strategy
# REQUIRES the kline closing at lock - kline_cutoff_seconds (cutoff=2
# is the canonical baseline; without that kline the strategy falls
# apart). Runtime tolerance for OKX publish-delay tails is via the
# max_consecutive_kline_fetch_failures streak counter (the bot fetches
# at the latest possible moment the wake schedule allows; the
# streak counter absorbs occasional publish-delay misses).
kline_cutoff_seconds = 2

# Pool aggregate horizon: only on-chain bets with block_ts < lock_at -
# pool_cutoff_seconds are counted into the cutoff-pool used by the
# strategy. The single-poll rail is cross-validated against this at
# config load (CAPTURE invariant). Canonical value: 6.
pool_cutoff_seconds = 6

# Streak counter on the live decision path. After this many consecutive
# OKX kline fetch failures the gate raises InvariantError, the bot
# crashes, and systemd restarts it + fires a Discord alert.
max_consecutive_kline_fetch_failures = 5

[dry]
# Starting bankroll for fresh dry runs (ignored when continuing from existing state)
initial_bankroll_bnb = 5.0

[live]
# Override all computed bet sizes to the contract minimum.
# All strategy logic still runs normally -- signal, sizing, filters -- but the
# actual submitted amount is clamped to minBetAmount for safe testing.
# 2026-07-01: set false after the new-VM go-live ladder cleared Step B
# (4 min-bet rounds fully validated on-chain: submit->confirm->settle->claim,
# 2 wins claimed, no anomalies). Now the live operating default = real
# sizing (0.01 floor / 0.1 cap per max_bet_bnb_*). Fresh deploys still start
# SAFE because install.sh leaves units DISABLED and docs/new_vm_install_checklist.md
# mandates the dry->min-bet->normal ladder before enabling live.
min_bet_only = false

[backtest]
# Number of most recent rounds to replay. Also controls how many rounds --sync fetches.
backtest_round_count = 35000
initial_bankroll_bnb = 50.0
# Optional epoch slicing. Both default to None (whole window). Uncomment
# to bound the backtest to a specific epoch range.
# epoch_start = 1234567   # inclusive lower bound
# epoch_end = 7654321     # inclusive upper bound

# ================================================================
# Strategy configuration
#
# IMPORTANT: All pool-related settings refer to the CUTOFF POOL
# (the partial pool observed at lock_at - pool_cutoff_seconds,
# ~6s before lock), NOT the final pool at settlement. The live bot
# only observes pool growth up to this cutoff to maintain
# deterministic decision-making.
# ================================================================

[strategy.pool_filter]
min_pool_bnb_at_cutoff = 1.5
min_payout_multiple_at_cutoff = 1.5

[strategy.gate]
# Multi-TF momentum gate: all lookbacks must agree in direction and
# min(|return|) must exceed mtf_min_return_threshold for the gate to fire.
# Previously module constants in momentum_gate.py.
mtf_lookbacks = [3, 7, 15]
mtf_min_return_threshold = 0.0001

[strategy.btc_primary.threshold]
# Small-pool admission: signal_strength must exceed small_pool_min_signal_strength when the
# pool is below pool_size_boundary_bnb (large pools rely on the gate's
# mtf_min_return_threshold). Removed key 'large_pool' was equal to mtf_min_return_threshold by
# construction (dead-by-equality).
small_pool_min_signal_strength = 0.0002
pool_size_boundary_bnb = 3.0

[strategy.btc_primary.sizing]
# base_pool_fraction: starting pool fraction for the bet.
# pool_fraction_slope: gain on signal_strength (frac = base + slope * strength).
# max_pool_fraction: hard cap on the resulting fraction.
# pool_fraction_slope and max_pool_fraction were previously module constants in momentum_pipeline.py.
base_pool_fraction = 0.04
pool_fraction_slope = 100.0
max_pool_fraction = 0.30

[strategy.eth_sol_fallback.signal]
min_signal_strength = 0.00015

[strategy.eth_sol_fallback.sizing]
base_pool_fraction = 0.02

[strategy.tier2_sizing]
# NOTE: "tier2" is a historical section name — these are CROSS-REGIME
# sizing knobs (they apply to the BTC-primary path too).
# Symmetric weight applied to BOTH ETH and SOL signal strengths in the
# BTC-primary confirmation boost AND the regime-2 effective-strength
# composition. Collapsed from former separate eth_sizing_weight /
# sol_sizing_weight (always identical in practice).
# Removed knob: payout_slope (hardcoded slope=1.0 in code now).
eth_sol_signal_weight = 0.3

# Lower bound applied at the end of _compute_bet_size:
# max(min_bet_threshold_bnb, min(cap_bnb, bet)). Distinct from the
# on-chain min_bet_amount_bnb (~0.001) which is checked at the call
# site. Bit-identical at default 0.01 because every observed bet on
# the canonical baseline already exceeds this floor (Phase 2 ablation
# 2026-04-23). Renamed from former 'floor_bnb' for clarity.
min_bet_threshold_bnb = 0.01

[strategy.risk]
# Risk controls active when a BankrollTracker is wired in (backtest always,
# dry/live when runtime constructs a PersistedBankrollTracker). All checks
# are no-ops when tracker is None. Defaults tuned to protect against
# worst-case deposit timing (peak-window sweep showed risk-OFF zeros the
# bankroll in a ~5k-round post-peak drawdown regime). These defaults ARE
# binding on the full backtest -- accepted PnL reduction buys insurance
# against catastrophic drawdown for small initial bankrolls.
max_bet_fraction_of_bankroll = 0.05        # bet <= 5% of current bankroll
min_bankroll_bnb_to_bet = 0.20                # pause all bets while bankroll < this
max_drawdown_fraction_from_peak = 0.15     # 1.0 = disabled; fires in normal regimes
cooldown_rounds = 288                  # ~1 day at 5-min rounds (2026-07-09 redesign; was 72/~6h)
# Composite cooldown state machine (2026-07-09). While the breaker has betting
# suspended, the pipeline still evaluates the gate every round and records the
# bets it WOULD have made into a persisted shadow ledger (sized off the
# hypothetical bankroll, same filters/caps as real bets, settled against
# realized pools + gas). At each cooldown expiry the suspension is EXTENDED by
# another cooldown_rounds unless the shadow shows genuine recovery:
#   n shadow fires >= shadow_min_fires_to_release
#   AND cumulative shadow PnL >= 0
#   AND hypothetical bankroll > hypothetical rolling-7d peak * shadow_recovery_peak_fraction
# On release the tracker's peak baseline is RESEEDED to the current bankroll
# (otherwise the unchanged real drawdown would re-fire the breaker instantly).
# The weekly monitor can also release the suspension via an override flag file
# (var/<mode>/cooldown_override.json) when its positive trigger fires.
extend_while_bleeding = true           # false = legacy fixed-length cooldown
monitor_override_enabled = true        # false = ignore the monitor's override flag
shadow_min_fires_to_release = 3        # fewer shadow fires than this at expiry -> extend
shadow_recovery_peak_fraction = 0.85   # hypo bankroll must exceed hypo peak * this
drawdown_peak_window_days = 7                        # rolling window for peak calculation
drawdown_peak_mode = "rolling_7d"      # peak-tracking semantics; alt: "absolute_ratchet" (monotonic since-launch peak)
# Absolute per-bet BNB caps (formerly under btc_primary.sizing / eth_sol_fallback.sizing).
# min floor is min_bet_threshold_bnb=0.01. Whether real sizing applies at all
# is gated by min_bet_only in [live] (see its comment; a new VM bring-up sets
# it true for the ladder's min-bet step, then restores false).
#
# 2026-08-24: 0.1 -> 0.05, a DILUTION correction.
#
# WHICH CLAMP ACTUALLY BINDS (measured across all 1,982 canonical fires with
# real pools and real signal strengths, not a worked example):
#   raw bet, no caps:  min 0.0249  p05 0.0549  p25 0.1144  p50 0.1977
#                      p95 0.7630  max 2.5133
#   raw < 0.10: 391/1982 (19.7%)      raw < 0.05: 74/1982 (3.7%)
# Nearly all sub-cap cases are the ETH/SOL FALLBACK regime, which sizes off
# base_pool_fraction = 0.02 (see [strategy.eth_sol_fallback.sizing]) against
# the primary's 0.04: 280 of the 391 come from it, and its minimum raw bet is
# 0.0249 versus 0.0505 for BTC primary.
#
# At the live bankroll of 1.889 BNB the OLD 0.1 absolute cap bound 0 times
# out of 1982 -- max_bet_fraction_of_bankroll bound every round. That is why
# observed live stakes tracked 0.05 x 1.889 = 0.0945 rather than 0.1000.
# After this change the ABSOLUTE cap binds 96.3% of rounds at any bankroll
# >= 1.0, and the bankroll fraction still binds the remaining 3.7% (the raws
# that already sit under 0.05).
#
# So the practical effect IS a near-flat 0.05 stake, but note what changed:
# the operative clamp moves from the bankroll fraction to the absolute cap.
# An earlier version of this comment claimed the adaptive terms "never
# survive" and that these caps "are what actually set the stake" -- both were
# false, generalised from one hand-picked BTC-primary example onto a path
# that serves both regimes. Do not act on the old framing: in particular,
# max_bet_fraction_of_bankroll is NOT inert, and raising it would change
# real behaviour.
#
# Measured EV per unit staked against pool depth (~2.7 BNB): 9.94% at 0.05,
# 9.73% at 0.02, 8.94% at 0.10 -- gross of gas. Gas doubles as a share of a
# halved stake, which costs 0.20pp at backtest gas (0.036pp at the
# live-observed median) against the 1.00pp advantage over 0.10, so it
# narrows the margin without changing the ranking and it strengthens 0.05
# over the 0.02 end of the band. 0.05 is the peak of the 0.02-0.05
# dilution-optimal band, so the top of the band is used rather than the
# middle.
#
# The ABSOLUTE cap is the right lever, not max_bet_fraction_of_bankroll: the
# dilution optimum depends on POOL DEPTH, not on our bankroll, so an absolute
# cap pins us in the band and stays there. Matching today's effect via the
# bankroll fraction would drift back out as the bankroll moves and would
# degrade the risk control that fraction exists to provide. The fraction is
# unchanged and remains the risk floor, still binding for the 3.7% of rounds
# whose raw size is under 0.05 and for any bankroll below ~1.0.
#
# REPORTING CONSEQUENCE: the weekly monitor copies this file verbatim and
# overrides only four keys, NOT max_bet_bnb_*. Every btPnL it reports
# therefore HALVES for reasons unrelated to strategy performance (7d
# 0.2277 -> 0.1142, 14d 0.5234 -> 0.2621). Sign flips are negligible -- that
# needs gross PnL in ~0.002-0.008 against typical 0.11-0.26 -- but do not
# read the smaller numbers as decay.
#
# DRAWDOWN BREAKER: the capital ceiling is UNCHANGED, because both the
# threshold and the loss are bankroll fractions -- the worst-case episode
# actually improves from 20.0% to 17.65% of bankroll. What halves is
# DETECTION SPEED: 6 consecutive max-losses to trip instead of 3, roughly
# 2.4 days instead of 1.2.
#
# CAVEAT: the 0.02-0.05 optimum is measured on golden-era data (n=1,446, real
# pool splits, impact-aware settlement). The post-June sample (n=98) is
# negative at every stake with CIs spanning zero, so it can neither confirm
# nor contradict. This is a dilution correction; it does NOT make an
# unprofitable strategy profitable.
max_bet_bnb_btc_primary = 0.05         # hard cap on BTC primary stake
max_bet_bnb_eth_sol_fallback = 0.05    # hard cap on ETH+SOL regime-2 stake
